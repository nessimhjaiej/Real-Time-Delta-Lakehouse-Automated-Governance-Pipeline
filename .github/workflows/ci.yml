name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    # A hung test (e.g. waiting on a service that isn't there) would otherwise
    # run for GitHub's 6 hour default.
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java 17
        # The PySpark tests need a JVM; pinning it avoids depending on what
        # the runner image happens to ship.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Code Formatting Check (Black)
        run: |
          black --check config/ src/ tests/

      - name: Linting Check (Ruff)
        run: |
          ruff check config/ src/ tests/

      - name: Type Checking (Mypy)
        run: |
          mypy config/ src/

      - name: Run Unit Tests (Pytest)
        # Tests that need a local MinIO (DuckDBExecutor) or Qdrant (RAG
        # ingest/retrieval/eval) skip themselves automatically here, since
        # this workflow doesn't provision either service -- see each test
        # file's requires_minio/requires_qdrant marker. Everything else,
        # including the fully-mocked agent/API/eval-runner tests, runs for
        # real with no network access beyond the dependency install above.
        run: |
          pytest tests/