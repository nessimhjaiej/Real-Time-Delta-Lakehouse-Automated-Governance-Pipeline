name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Code Formatting Check (Black)
        run: |
          black --check config/ src/ tests/

      - name: Linting Check (Ruff)
        run: |
          ruff check config/ src/ tests/

      - name: Type Checking (Mypy)
        run: |
          mypy config/ src/

      - name: Run Unit Tests (Pytest)
        # Tests that need a local MinIO (DuckDBExecutor) or Qdrant (RAG
        # ingest/retrieval/eval) skip themselves automatically here, since
        # this workflow doesn't provision either service -- see each test
        # file's requires_minio/requires_qdrant marker. Everything else,
        # including the fully-mocked agent/API/eval-runner tests, runs for
        # real with no network access beyond the dependency install above.
        run: |
          pytest tests/