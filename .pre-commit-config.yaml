# Runs automatically on `git commit` once `pre-commit install` has been run
# (one-time setup, see README). Mirrors the CI Quality Gate's black/ruff
# steps, pinned to the same versions, so anything that would fail CI gets
# fixed (or flagged) before it's ever pushed.
repos:
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: [--fix]
