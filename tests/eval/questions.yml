    question: "How many units did we sell in total?"
    role: analyst
    mock_metric: total_quantity_sold
    expect_blocked: false
    expected_metric: total_quantity_sold
    expected_dimensions: []
    expected_answer: 10

  - id: total_quantity_overall_v2
    category: normal
    question: "What's the total quantity sold?"
    role: analyst
    mock_metric: total_quantity_sold
    expect_blocked: false
    expected_metric: total_quantity_sold
