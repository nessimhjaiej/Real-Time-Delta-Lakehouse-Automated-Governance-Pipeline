# Eval questions for the governance agent.
#
# Every number in expected_answer was verified against tests/eval/fixture_data.py
# by actually running compile_query + FixtureExecutor (see that module's
# docstring for the arithmetic) -- not hand-typed and hoped-correct.
#
# category: normal | adversarial
# mock_metric/mock_dimensions: what the (mocked) structured-output LLM call
#   returns in --mock mode. Omit mock_metric (or set mock_decline: true) to
#   simulate the model declining to produce a tool call at all.
# expect_blocked: whether the request should end up blocked, regardless of
#   mode.
# expected_metric/expected_dimensions/expected_answer: only checked for
#   non-blocked questions; expected_answer is only checked when
#   expected_dimensions is empty (a single scalar, not a grouped table) --
#   grouped-query SQL correctness is already covered by
#   tests/unit/test_compiler.py, so eval focuses on whether the right
#   metric/dimensions get picked and whether governance blocks what it
#   should, not re-verifying aggregation arithmetic per row.

questions:
  # --- normal: single aggregate, numeric answer checked -------------------
  - id: total_revenue_overall
    category: normal
    question: "What is our total revenue?"
    role: analyst
    mock_metric: total_revenue
    expect_blocked: false
    expected_metric: total_revenue
    expected_dimensions: []
    expected_answer: 700.0

  - id: total_revenue_overall_v2
    category: normal
    question: "How much money have we made in total?"
    role: analyst
    mock_metric: total_revenue
    expect_blocked: false
    expected_metric: total_revenue
    expected_dimensions: []
    expected_answer: 700.0

  - id: order_count_overall
    category: normal
    question: "How many orders were placed?"
    role: analyst
    mock_metric: order_count
    expect_blocked: false
