  - id: average_order_value_overall_v2
    category: normal
    question: "What's our average revenue per order?"
    role: analyst
    mock_metric: average_order_value
    expect_blocked: false
    expected_metric: average_order_value
    expected_dimensions: []
    expected_answer: 116.6667

  # --- normal: grouped (metric/dimension picking checked, not every row) --
  - id: total_revenue_by_country
    category: normal
    question: "What's our revenue broken down by country?"
    role: analyst
    mock_metric: total_revenue
    mock_dimensions: [customer_country]
